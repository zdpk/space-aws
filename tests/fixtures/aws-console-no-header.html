<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AWS Dream QA Fixture - AWS Console header (not yet mounted)</title>
  <!--
    Simulates an AWS Console page load before the header has appeared in
    the DOM (e.g. very early in a client-side render, or a page whose
    markup diverges from every known candidate selector). Used to test
    the fail-closed "wait for a bounded DOM signal, then safely do
    nothing" path from PRD.md §11 and design.md §3: no header mount
    candidate exists anywhere in this document, so region-detector /
    header-renderer / navigation-observer must not throw, must not
    inject anything, and must not loop indefinitely waiting for a
    mount point that will never appear in this fixture.
  -->
</head>
<body>
  <div id="app">
    <div id="loading-placeholder" role="status" aria-live="polite">
      Loading AWS Management Console&hellip;
    </div>
  </div>
</body>
</html>
