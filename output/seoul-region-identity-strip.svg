      <circle cx="0" cy="0" r="1.4" fill="#7f98b2" fill-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="thinGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>
  </defs>

  <rect width="4096" height="128" fill="url(#base)"/>
  <rect x="1320" width="1660" height="128" fill="url(#centerGlow)"/>
  <rect x="1220" width="1880" height="128" fill="url(#microGrid)" opacity="0.72"/>
  <path d="M0 1.5H4096" stroke="#5d7894" stroke-opacity="0.16"/>

