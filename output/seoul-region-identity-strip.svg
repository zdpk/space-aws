    <path d="M1810 106V96H1830V106H1840V87H1864V106H1876V99H1900V106H1912V92H1936V106H1950V97H1974V106Z"/>
    <path d="M2450 106V95H2473V106H2485V90H2510V106H2522V98H2548V106H2560V92H2585V106H2600V99H2622V106Z"/>
    <path d="M2710 106V96H2732V106H2744V88H2770V106H2782V97H2806V106H2820V91H2844V106H2857V98H2882V106Z"/>
