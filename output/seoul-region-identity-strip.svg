    <circle cx="1950" cy="108" r="1.2"/><circle cx="2020" cy="108" r="1.2"/>
  </g>

  <!-- Namsan hill and N Seoul Tower: primary Region identifier. -->
  <path d="M2070 110C2135 98 2182 92 2244 91C2310 90 2370 97 2435 110Z" fill="#101b2a"/>
  <ellipse cx="2252" cy="62" rx="34" ry="40" fill="#527e96" opacity="0.14" filter="url(#softGlow)"/>
  <g filter="url(#thinGlow)" opacity="0.72">
