    <path d="M1710 108Q1760 95 1810 108Q1860 95 1910 108Q1960 95 2010 108Q2040 101 2060 108"/>
    <path d="M1740 108V114M1810 108V114M1880 108V114M1950 108V114M2020 108V114"/>
