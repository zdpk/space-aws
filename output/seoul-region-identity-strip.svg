      <stop offset="0" stop-color="#040609"/>
      <stop offset="0.34" stop-color="#070b12"/>
      <stop offset="0.52" stop-color="#0a1321"/>
      <stop offset="0.68" stop-color="#08101c"/>
      <stop offset="1" stop-color="#040609"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172236" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22344d" stop-opacity="0.45"/>
      <stop offset="0.58" stop-color="#263c58" stop-opacity="0.7"/>
      <stop offset="0.78" stop-color="#16283e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d48670"/>
      <stop offset="0.48" stop-color="#7ea8b8"/>
      <stop offset="1" stop-color="#4e788e"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="55%" cy="52%" r="42%">
      <stop offset="0" stop-color="#31506d" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#192a40" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#090d14" stop-opacity="0"/>
