    <circle cx="2757" cy="95" r="1.2"/><circle cx="2832" cy="97" r="1.2"/>
  </g>

  <!-- Han River and a single abstract bridge. -->
  <path d="M1420 109C1770 106 1960 112 2240 109C2490 106 2700 111 3030 108" fill="none" stroke="#47748d" stroke-opacity="0.55" stroke-width="1.8"/>
