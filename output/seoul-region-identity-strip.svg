  <g opacity="0.74">
    <path d="M2657 42C2662 53 2668 67 2671 82L2674 108H2640L2643 82C2646 67 2652 53 2657 42Z" fill="#101c2b" stroke="#6b8ca0" stroke-width="1.7"/>
